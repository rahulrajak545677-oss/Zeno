name: Build ZENO APK from zip

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          ZIP=$(ls *.zip | head -n 1)
          if [ -z "$ZIP" ]; then echo "::error::No .zip file found in repo root"; exit 1; fi
          echo "Using $ZIP"
          mkdir -p src
          unzip -q -o "$ZIP" -d src
          if [ ! -f src/settings.gradle.kts ]; then
            INNER=$(dirname "$(find src -maxdepth 3 -name settings.gradle.kts | head -n 1)")
            if [ -z "$INNER" ] || [ "$INNER" = "." ]; then echo "::error::settings.gradle.kts not found in zip"; exit 1; fi
            mv "$INNER" project && rm -rf src && mv project src
          fi
          ls -la src

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Prepare keystore and env
        working-directory: src
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then cp .env.example .env; fi

      - name: Run unit tests
        working-directory: src
        continue-on-error: true
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        working-directory: src
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload ZENO Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: zeno-debug-apk
          path: src/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: src/app/build/reports/tests/
          if-no-files-found: ignore
